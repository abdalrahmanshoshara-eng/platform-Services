name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: reports_db
          POSTGRES_USER: reports_user
          POSTGRES_PASSWORD: ci_secret_pw_not_default
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reports_user -d reports_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: reports_db
      POSTGRES_USER: reports_user
      POSTGRES_PASSWORD: ci_secret_pw_not_default
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production-000000000000
      DJANGO_DEBUG: "False"
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (PDF conversion path)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Black (format check)
        run: black --check .
      - name: Django system checks
        run: python manage.py check
      - name: Migration consistency check
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (PostgreSQL)
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose config >/dev/null
      - name: Ensure no committed .env
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env must not be committed"; exit 1
          fi
          echo "OK: no .env committed"
